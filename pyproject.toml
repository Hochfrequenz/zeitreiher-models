[project]
name = "zeitreiher-models"
description = "Hand-written public data models of the Zeitreiher API (SAP IS-U EDM profile values)"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Hochfrequenz Unternehmensberatung GmbH", email = "info+github@hochfrequenz.de" }]
keywords = ["sap", "is-u", "edm", "lastgang", "time series", "zeitreiher"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.11",
]
dynamic = ["readme", "version"]

[project.optional-dependencies]
# Stubs for zeitreiher.v1 and proto <-> model converters (zeitreiher_models.grpc). The floors equal the
# versions the stubs are generated with (codegen group below): generated code refuses older runtimes.
grpc = [
    "grpcio>=1.70,<2",
    "protobuf>=5.29,<7",
    "googleapis-common-protos>=1.66,<2",  # google.rpc.Status / ErrorInfo for error_reason()
]

[project.urls]
Changelog = "https://github.com/Hochfrequenz/zeitreiher-models/releases"
Homepage = "https://github.com/Hochfrequenz/zeitreiher-models"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["*.md", "src/zeitreiher_models/grpc/v1"]  # generated (scripts/generate_grpc.py)

[tool.ruff.lint]
select = ["D", "E", "W", "F", "I", "UP", "B", "N", "PL", "RUF"]
ignore = ["PLR0913", "PLR0917", "PLR0912", "PLR0915", "PLR2004"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"unittests/*" = ["D"]

[tool.mypy]
disable_error_code = []
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# googleapis-common-protos ships no type information (google.rpc.Status / ErrorInfo)
module = ["google.rpc", "google.rpc.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["unittests"]

[dependency-groups]
tests = [
    "pytest==9.2.0",
    "tzdata>=2025.2",  # zoneinfo data on Windows
]
linting = [
    "ruff==0.17.3",
    {include-group = "tests"},
]
type_check = [
    "mypy==2.4.1",
    "types-grpcio",  # zeitreiher_models.grpc
    "types-protobuf",
    {include-group = "tests"},
]
spell_check = [
    "codespell==2.4.3",
]
coverage = [
    "coverage==7.17.0",
    {include-group = "tests"},
]
# Regenerates src/zeitreiher_models/grpc/v1 (scripts/generate_grpc.py). Pinned on purpose and kept in
# step with the floors of the grpc extra; Dependabot ignores both (see .github/dependabot.yml).
codegen = [
    "grpcio-tools==1.70.0",
    "mypy-protobuf==3.6.0",
]
dev = [
    {include-group = "tests"},
    {include-group = "linting"},
    {include-group = "type_check"},
    {include-group = "spell_check"},
    {include-group = "coverage"},
]

[tool.uv]
default-groups = ["tests"]  # `uv run pytest` works on a fresh clone

[build-system]
requires = ["hatchling>=1.8.0", "hatch-vcs", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"
fragments = [{ path = "README.md" }]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/zeitreiher_models/_version.py"
template = '''
version = "{version}"
'''

[tool.hatch.build.targets.sdist]
exclude = ["/unittests"]

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]
