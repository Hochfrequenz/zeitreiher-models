syntax = "proto3";

package zeitreiher.v1;

import "google/protobuf/timestamp.proto";
import "zeitreiher/v1/query.proto";
import "zeitreiher/v1/selector.proto";

// ResolveRequest is the request of SeriesService.Resolve (JSON: POST /api/v1/series/resolve).
// Timestamps follow the request rules of QueryRequest.
message ResolveRequest {
  repeated Selector select = 1;
  string from = 2;
  string to = 3;
}

// ResolveResponse holds one result per request selector.
message ResolveResponse {
  repeated SelectorResult results = 1;
}

// ListVersionsRequest is the request of SeriesService.ListVersions
// (JSON: POST /api/v1/series/versions).
message ListVersionsRequest {
  repeated Selector select = 1;
  string from = 2;
  string to = 3;
}

// ListVersionsResponse holds one result per request selector; assignments carry versions.
message ListVersionsResponse {
  repeated SelectorResult results = 1;
}

// SelectorResult is the outcome for one request selector. If `error` is set, the selector failed
// and `assignments` is empty (JSON: omitted); otherwise `assignments` holds, possibly empty
// (JSON: always written).
message SelectorResult {
  int64 selector = 1;
  Selector select = 2;
  repeated Assignment assignments = 3;
  ResultError error = 4;
}

// Assignment is one profile assignment cut to the request window, or an assignment-level error.
// from/to are set together; they are required unless `error` is set. `versions` is used by
// ListVersions only (JSON: written, possibly [], when `error` is unset).
// role, unit and unit_raw describe the profile like the series record; without `error` JSON always
// writes role and unit (null when unset) and unit_raw is required.
message Assignment {
  string profile = 1;
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
  repeated Version versions = 4;
  ResultError error = 5;
  // Role of the profile assignment (SAP EPROFASS role, e.g. "0001"); unset (JSON null) when the
  // assignment was not resolved through a role (e.g. by: profile).
  optional string role = 6;
  // Canonical unit code (UN/ECE Rec. 20, e.g. "KWH") of the profile's values; unset (JSON null)
  // when the SAP unit has no mapping.
  optional string unit = 7;
  // The SAP unit key (T006 MSEHI) as SAP delivers it, mapped or not: non-empty, at most 30
  // characters, no control characters. Empty only in an assignment with `error`.
  string unit_raw = 8;
}

// ResultError carries a record-level code (see ErrorRecord.code).
message ResultError {
  string code = 1;
}
