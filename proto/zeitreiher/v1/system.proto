syntax = "proto3";

package zeitreiher.v1;

// SystemRequest is the (empty) request of SeriesService.System (JSON: GET /api/v1/system).
message SystemRequest {}

// SystemResponse describes the service and the SAP system behind it.
message SystemResponse {
  string service_version = 1;
  string abap_package_version = 2;
  string sid = 3;
  string client = 4;
  string release = 5;
  // SAP time zone code, e.g. "CET".
  string business_time_zone = 6;
  // Supported request intervals, e.g. ["PT15M", "PT60M"].
  repeated string intervals = 7;
  // Canonical unit codes (UN/ECE Rec. 20, e.g. "KWH") the system can map to SAP units.
  repeated string units = 8;
  // Limits of the service (see Caps).
  Caps caps = 9;
}

// Caps are the limits of the service (spec section 3.1), reported so that clients know how it works.
// max_window_seconds and max_values bound one internal SAP values call; the service splits a query window
// accordingly.
// max_resolve_window_seconds is the longest request window the service accepts for query, resolve and
// versions; longer windows are rejected with invalid_request.
// Versions and resolve are not split and have no value cap.
// The internal window_too_large answer of SAP never reaches public clients.
message Caps {
  // Longest window in seconds of one internal SAP values call; longer query windows are split.
  int64 max_window_seconds = 1;
  // Highest number of values of one internal SAP values call.
  int64 max_values = 2;
  // Longest request window in seconds the service accepts for query, resolve and versions; a longer window
  // is a 400 invalid_request.
  int64 max_resolve_window_seconds = 3;
}
