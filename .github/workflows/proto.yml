name: "Proto"

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

jobs:
  buf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - name: Install buf
        run: go install github.com/bufbuild/buf/cmd/buf@v1.75.0
      - name: buf build
        run: buf build
      - name: buf lint
        run: buf lint
      - name: buf format
        run: buf format --diff --exit-code
