name: "Packaging Test"

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  check_packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.15"
      - name: Build distributions
        run: uv build
      - name: Check distributions
        run: uv publish --dry-run
      - name: Check that the wheel has no top-level modules
        run: |
          unzip -Z1 dist/*.whl
          if unzip -Z1 dist/*.whl | grep -E '\.py$' | grep -v '^zeitreiher_models/'; then
            echo "the wheel contains .py files outside zeitreiher_models/" >&2
            exit 1
          fi
      - name: Install the wheel into a fresh venv and import it
        run: |
          uv venv "$RUNNER_TEMP/wheel-venv"
          uv pip install --python "$RUNNER_TEMP/wheel-venv" dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-venv/bin/python" -c "import zeitreiher_models as m; assert m.__version__; print(m.__version__)"
      - name: The base install does not import grpc or protobuf, and zeitreiher_models.grpc needs the extra
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-venv/bin/python" - <<'PY'
          import sys
          import zeitreiher_models
          leaked = [m for m in sys.modules if m == "grpc" or m == "google.protobuf" or m.startswith(("grpc.", "google.protobuf."))]
          assert not leaked, leaked
          try:
              import zeitreiher_models.grpc
          except ImportError as exc:
              assert "zeitreiher-models[grpc]" in str(exc), exc
          else:
              raise SystemExit("zeitreiher_models.grpc imported without the grpc extra")
          PY
      - name: Install the wheel with the grpc extra and import the stubs
        run: |
          uv venv "$RUNNER_TEMP/grpc-venv"
          uv pip install --python "$RUNNER_TEMP/grpc-venv" "$(ls "$PWD"/dist/*.whl)[grpc]"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/grpc-venv/bin/python" -c "import zeitreiher_models.grpc.v1.series_service_pb2_grpc, zeitreiher_models.grpc as g; print(g.ERROR_DOMAIN)"
