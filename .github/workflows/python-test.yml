name: "Python Tests"

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Dependencies
        run: uv sync --group tests --extra grpc
      - name: Run the Unit Tests
        run: uv run pytest unittests

  lowest-grpc:
    name: "gRPC extra at its lowest versions"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - name: Install Dependencies
        run: uv sync --group tests --extra grpc
      - name: Pin the floors of the grpc extra
        run: uv pip install "grpcio==1.70.0" "protobuf==5.29.0" "googleapis-common-protos==1.66.0"
      - name: Run the Unit Tests
        run: uv run --no-sync pytest unittests

  # The lock pins protobuf 5.29.x (grpcio-tools 1.70.0, used for code generation, needs protobuf<6), but
  # consumers mostly get protobuf 6.x/7.x: test the newest versions the extra allows.
  highest-grpc:
    name: "gRPC extra at its highest versions"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"
      - name: Install Dependencies
        run: uv sync --group tests --extra grpc
      - name: Upgrade the grpc extra to the newest allowed versions
        run: uv pip install -U "protobuf<8" "grpcio<2" "googleapis-common-protos<2"
      - name: Show the installed versions
        run: uv pip list | grep -iE "^(protobuf|grpcio|googleapis-common-protos) "
      - name: Run the Unit Tests
        run: uv run --no-sync pytest unittests
