version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # The generated stubs (src/zeitreiher_models/grpc/v1) depend on the exact generator versions, and the
      # gencode version is tied to the floors of the grpc extra (protobuf, grpcio). Bump these two by hand,
      # together with scripts/generate_grpc.py, the extra's floors and a regeneration.
      - dependency-name: "grpcio-tools"
      - dependency-name: "mypy-protobuf"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
